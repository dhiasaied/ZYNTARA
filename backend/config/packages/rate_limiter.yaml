framework:
    rate_limiter:
        run_creation:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        registration:
            policy: fixed_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            run_creation:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
            registration:
                policy: fixed_window
                limit: 1000
                interval: '1 hour'
