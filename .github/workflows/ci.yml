name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, sodium
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php bin/console lint:container --env=test
      - run: php bin/console doctrine:schema:validate --skip-sync --env=test
      - run: php bin/phpunit

  agents:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agents } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, agents, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
